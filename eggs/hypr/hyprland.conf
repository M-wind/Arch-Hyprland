monitor=,preferred,auto,auto

$terminal = foot -d none
# $terminal = alacritty 
$browser = ~/app/zen/zen
$wallpapern = wpaperctl next
$wallpaperp = wpaperctl previous
# $wallpapern = lianwall next
# $wallpaperp = lianwall prev

# exec-once = hyprlock
exec-once = wpaperd -d
# exec-once = lianwall start
exec-once = clipse -listen
exec-once = eww-hypripc 
exec-once = eww daemon && eww-volume getinitvol && eww open bar 
exec-once = fcitx5 -d && fcitx5_tray
# exec-once = hyprctl plugin load ~/app/hypr/hyprexpo.so

env = HYPRCURSOR_THEME,phinger-cursors-light
env = HYPRCURSOR_SIZE,24
#####################
### LOOK AND FEEL ###
#####################

# plugin {
#   hyprexpo {
#     columns = 2
#     gap_size = 6
#     workspace_method = first current
#     gesture_distance = 300
#     skip_empty = false
#   }
# }
# bind = $mainMod, O, hyprexpo:expo, toggle

general {
    gaps_in = 3
    gaps_out = 6, 6, 0, 6
    border_size = 0
    col.active_border = rgba(98c379ff)
    col.inactive_border = rgba(2222227f)
    allow_tearing = true
    # layout = scrolling
    layout = dwindle
    # layout = master
    resize_on_border = false
    extend_border_grab_area = 20
    hover_icon_on_border = true
    # snap {
    #   enabled = true
    #   border_overlap = true
    # }
}

scrolling {
    fullscreen_on_one_column = false
    column_width = 0.5
    focus_fit_method = 1
    follow_focus = true
    follow_min_visible = 0.4 
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    # wrap_focus = true
    # wrap_swapcol = true
    direction = right
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    split_width_multiplier = 1.4
}

master {
    allow_small_split = true
    new_status = master
    mfact = 0.5
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
        # enabled = true
        size = 1
        passes = 2
        ignore_opacity = true
        new_optimizations = true
        xray = true
        # popups = true
        # popups_ignorealpha = 0.79
        input_methods = true
        input_methods_ignorealpha = 0.79
    }
    shadow {
        enabled = true
        range = 18
        render_power = 4
        # {# replace_color_foot(theme.colors.cyan) #}
        color = 0xff29a298
        color_inactive = 0x00a7caff
    }
}

animations {
    enabled = true
    workspace_wraparound = true
    # bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    # bezier = myBezier, 0.5, 1, 0.89, 1
    bezier = myBezier, 0.16, 1, 0.3, 1
    # bezier = myBezier, 0.87, 0, 0.13, 1
    # bezier = myBezier, 0.22, 1, 0.36, 1

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = -0.6 # -1.0 - 1.0, 0 means no modification.
    accel_profile = adaptive
    touchpad {
        natural_scroll = false
    }
    numlock_by_default = true
}

gestures {
    # workspace_swipe = false
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = false 
    disable_hyprland_guiutils_check = true
    disable_xdg_env_checks = true
    disable_watchdog_warning = true
    enable_anr_dialog = false
}

xwayland {
    enabled = false
}

render {
    direct_scanout = 0
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

device {
    # name = rapoo-v720-gaming-keyboard-mouse
    # sensitivity = 0
}


debug {
    # disable_time = false
    # disable_logs = false
    # enable_stdout_logs = true
    disable_scale_checks = true
    colored_stdout_logs = false
    # overlay = true
    # error_limit = -1
    # error_position = 0
}

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, T, exec, $terminal                  
bind = $mainMod, W, killactive
bind = $mainMod, V, togglefloating
bind = $mainMod, V, centerwindow
bind = $mainMod SHIFT, R, centerwindow
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, E, exec, $terminal -a yazi -e yazi 
bind = $mainMod SHIFT, V, exec, $terminal -a clipse -e clipse
bind = $mainMod, R, exec, $terminal -a rmpc -e rmpc
bind = CTRL SHIFT, ESCAPE, exec, $terminal -a btop -e btop
bind = $mainMod, S, layoutmsg, togglesplit
bind = $mainMod, P, pseudo
bind = $mainMod, B, exec, $browser # zen browser
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod, bracketright, exec, $wallpapern  #]
bind = $mainMod, bracketleft, exec, $wallpaperp   #[
bind = $mainMod, M, exec, mpv --player-operation-mode=pseudo-gui
bind = $mainMod, N, exec, neovide 
bind = $mainMod, D, exec, eww-window toggle bar 
bind = $mainMod, Z, exec, eww-minimize minimizecurrent  
bind = $mainMod, X, exec, eww-minimize reminimize 

bind = $mainMod, right, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, L, movefocus, r
bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, C, cyclenext, next

bind = $mainMod ALT, L, movewindow, r
bind = $mainMod ALT, H, movewindow, l
bind = $mainMod ALT, K, movewindow, u
bind = $mainMod ALT, J, movewindow, d

bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, left, movewindow, l
bind = $mainMod ALT, up, movewindow, u
bind = $mainMod ALT, down, movewindow, d

bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

bind = $mainMod SHIFT, S, exec, screentool -n -t capture -s area -f ~/screenshots/area-$(date +'%F-%T-%N.png')
bind = ,Print, exec, screentool -n -t capture -s full -f ~/screenshots/full-$(date +'%F-%T-%N.png')

binde = $mainMod CTRL, H, resizeactive, -20 0
binde = $mainMod CTRL, J, resizeactive, 0 20
binde = $mainMod CTRL, K, resizeactive, 0 -20
binde = $mainMod CTRL, L, resizeactive, 20 0

binde = $mainMod CTRL, left, resizeactive, -20 0
binde = $mainMod CTRL, down, resizeactive, 0 20
binde = $mainMod CTRL, up, resizeactive, 0 -20
binde = $mainMod CTRL, right, resizeactive, 20 0

bind = $mainMod CTRL, M, exec, eww-volume togglebykey
bindel = ,XF86AudioMute, exec, eww-volume togglebykey
binde = $mainMod CTRL, equal, exec, eww-volume adjustbykey 0.05 #=
binde = $mainMod CTRL, minus, exec, eww-volume adjustbykey -0.05  #-
bind = $mainMod CTRL, BackSpace, exec, eww-volume defaultbykey

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2 
bind = $mainMod, 3, workspace, 3 
bind = $mainMod, 4, workspace, 4 
bind = $mainMod, 5, workspace, 5 
bind = $mainMod, 6, workspace, 6 
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

bind = $mainMod SHIFT, Q, exit

bind = CTRL ALT, L, exec, hyprlock

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

windowrule = match:class neovide, opacity 0.69, float on, size 1831 1035
windowrule = match:class yazi, float on, size 1280 726
windowrule = match:class rmpc, float on, size 1271 726
windowrule = match:class btop, float on, size 1536 864
windowrule = match:class clipse, float on, size 720 480
windowrule = match:class mpv, float on
windowrule = match:class zen, match:title 画中画, float on, center on, size 1690 951

layerrule = match:namespace bar, blur on
layerrule = match:namespace bar-right-slide, blur on, animation slide right
layerrule = match:namespace bar-center-popin, blur on, animation layersIn
# layerrule = match:namespace bar-center-popin, blur on, ignore_alpha 1, animation slide right

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*

# windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
# Fix some dragging issues with XWaylandhyp
