input_bindings:
  up: [up, k]
  down: [down, j]
  left: [left, h]
  right: [right, l]
  scroll_left: [ctrl h]
  scroll_right: [ctrl l]
  select_recipe_list: [w]
  quit: [q]
  force_quit: [ctrl c]
  edit: [e]
  view:  [v]
  history: [shift h]
  fullscreen: [f]
  open_actions: [x]
  page_up: [ctrl d, pgup]
  page_down: [ctrl f, pgdn]
  next_pane: [ctrl j, tab]
  previous_pane: [ctrl k, ctrl tab]
