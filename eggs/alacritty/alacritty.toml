[general]
ipc_socket = false

[window]
padding = { x = 8, y = 0 }
decorations = "None"
decorations_theme_variant = "None"
opacity = 0.69
# blur = true
class = { instance = "alacritty", general = "alacritty" }

[font]
# normal = { style = "Bold" }
size = 13
builtin_box_drawing = true

[cursor]
style = { shape = "Beam" }
vi_mode_style = { shape = "Beam" }
unfocused_hollow = true
thickness = 0.15

[terminal]
osc52 = "CopyPaste"

[hints]
alphabet = "abcdefghijklmnopqrstuvwxyz;"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
binding = { key = "O", mods = "Control|Shift" }
mouse.enabled = false

[keyboard]
bindings = [
  { key = "F", mods = "Control|Shift", mode = "Vi", action = "None" },
  { key = "Space", mods = "Control|Shift", mode = "Vi", action = "None" },
  { key = "Enter", mods = "Control|Shift", mode = "~Search", action = "ToggleViMode" },
  { key = "H", mods = "Control|Shift", action = "SearchForward" },
  { key = "G", mods = "Control", action = "ScrollToTop" },
  { key = "G", mods = "Control|Shift", action = "ScrollToBottom" },
  { key = "N", mods = "Control|Shift", mode = "Search", action = "SearchFocusPrevious" },
  { key = "N", mods = "Control", mode = "Search", action = "SearchFocusNext" },
  { key = "N", mods = "Control|Shift", mode = "Vi", action = "SearchPrevious" },
  { key = "N", mods = "Control", mode = "Vi", action = "SearchNext" },
  { key = "D", mods = "Control", mode = "~AppCursor|~AppKeypad|~Alt", action = "ScrollLineUp" },
  { key = "F", mods = "Control", mode = "~AppCursor|~AppKeypad|~Alt", action = "ScrollLineDown" },
]

[debug]
# prefer_egl = true

[colors.primary]
background = '#001419' # {< replace_color(theme.colors.background) >}
foreground = '#cdd6f4' # {< replace_color(theme.colors.foreground) >}

[colors.normal]
black = '#45475a'   # {< replace_color(theme.colors.black) >}
red = '#f38ba8'     # {< replace_color(theme.colors.red) >}
green = '#a6e3a1'   # {< replace_color(theme.colors.green) >}
yellow = '#f9e2af'  # {< replace_color(theme.colors.yellow) >}
blue = '#89b4fa'    # {< replace_color(theme.colors.blue) >}
magenta = '#f5c2e7' # {< replace_color(theme.colors.magenta) >}
cyan = '#94e2d5'    # {< replace_color(theme.colors.cyan) >}
white = '#bac2de'   # {< replace_color(theme.colors.white) >}

[colors.bright]
black = '#585b70'   # {< replace_color(theme.colors.bright_black) >}
red = '#f38ba8'     # {< replace_color(theme.colors.bright_red) >}
green = '#a6e3a1'   # {< replace_color(theme.colors.bright_green) >}
yellow = '#f9e2af'  # {< replace_color(theme.colors.bright_yellow) >}
blue = '#89b4fa'    # {< replace_color(theme.colors.bright_blue) >}
magenta = '#f5c2e7' # {< replace_color(theme.colors.bright_magenta) >}
cyan = '#94e2d5'    # {< replace_color(theme.colors.bright_cyan) >}
white = '#a6adc8'   # {< replace_color(theme.colors.bright_white) >}
