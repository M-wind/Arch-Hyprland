[general]
ipc_socket = false

[window]
padding = { x = 8, y = 3 }
decorations = "None"
decorations_theme_variant = "None"
opacity = 0.69
blur = true
class = { instance = "alacritty", general = "alacritty" }

[font]
normal = { style = "Bold" }
size = 13
builtin_box_drawing = true

[cursor]
style = { shape = "Beam" }
unfocused_hollow = true
thickness = 0.15

[terminal]
osc52 = "CopyPaste"

[hints]
alphabet = "abcdefghijklmnopqrstuvwxyz;"

[keyboard]
bindings = [
  { key = "F", mods = "Control|Shift", action = "None" },
  { key = "H", mods = "Control|Shift", action = "SearchForward" },
  { key = "D", mods = "Control", mode = "Search", action = "SearchFocusPrevious" },
  { key = "F", mods = "Control", mode = "Search", action = "SearchFocusNext" },
  { key = "D", mods = "Control", mode = "Vi", action = "SearchPrevious" },
  { key = "F", mods = "Control", mode = "Vi", action = "SearchNext" },
  { key = "D", mods = "Control", action = "ScrollLineUp" },
  { key = "F", mods = "Control", action = "ScrollLineDown" },
]

[debug]
prefer_egl = true

[colors.primary]
background = '#1e1e2e' # {< replace_color(theme.colors.background) >}
foreground = '#cdd6f4' # {< replace_color(theme.colors.foreground) >}

[colors.normal]
black = '#45475a' # {< replace_color(theme.colors.black) >}
red = '#f38ba8' # {< replace_color(theme.colors.red) >}
green = '#a6e3a1' # {< replace_color(theme.colors.green) >}
yellow = '#f9e2af' # {< replace_color(theme.colors.yellow) >}
blue = '#89b4fa' # {< replace_color(theme.colors.blue) >}
magenta = '#f5c2e7' # {< replace_color(theme.colors.magenta) >}
cyan = '#94e2d5' # {< replace_color(theme.colors.cyan) >}
white = '#bac2de' # {< replace_color(theme.colors.white) >}

[colors.bright]
black = '#585b70' # {< replace_color(theme.colors.bright_black) >}
red = '#f38ba8' # {< replace_color(theme.colors.bright_red) >}
green = '#a6e3a1' # {< replace_color(theme.colors.bright_green) >}
yellow = '#f9e2af' # {< replace_color(theme.colors.bright_yellow) >}
blue = '#89b4fa' # {< replace_color(theme.colors.bright_blue) >}
magenta = '#f5c2e7' # {< replace_color(theme.colors.bright_magenta) >}
cyan = '#94e2d5' # {< replace_color(theme.colors.bright_cyan) >}
white = '#a6adc8' # {< replace_color(theme.colors.bright_white) >}

